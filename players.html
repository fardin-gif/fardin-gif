<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Players — PHY-LIGA</title>
<link rel="icon" type="image/png" href="favicon.png" />
<meta name="description" content="Browse every registered player of PHY-LIGA Season 01 — the Intra-Department Football Tournament of the Department of Physics, University of Dhaka." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --clr-canvas: #162235;
    --clr-surface: #1E2D42;
    --clr-surface-alt: #253850;
    --clr-accent-primary: #A1C4C7;
    --clr-accent-interactive: #34DFEC;
    --clr-highlight: #2A8042;
    --clr-danger: #E24C4C;
    --clr-text-muted: #7E8B9B;
    --clr-text-primary: #EAF2F2;
    --radius-md: 12px;
    --radius-lg: 20px;
    --shadow-glow: 0 0 24px rgba(52, 223, 236, 0.15);
    --font-display: 'Orbitron', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; overflow-x: hidden; }

  body {
    background-color: var(--clr-canvas);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(52,223,236,0.06), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(42,128,66,0.08), transparent 45%);
    color: var(--clr-text-primary);
    font-family: var(--font-body);
    line-height: 1.55;
    min-height: 100vh;
    overflow-x: hidden;
    width: 100%;
  }

  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; height: auto; }
  ::selection { background: var(--clr-accent-interactive); color: var(--clr-canvas); }
  :focus-visible { outline: 2px solid var(--clr-accent-interactive); outline-offset: 3px; }

  /* ---------- HEADER / NAV (shared) ---------- */
  header.site-header {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 18px 5vw;
    background: rgba(22, 34, 53, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(161, 196, 199, 0.12);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .logo-img { display: block; height: 36px; width: auto; max-width: 140px; flex-shrink: 1; }
  .brand .season-tag {
    font-family: var(--font-mono); font-size: 0.7rem; color: var(--clr-text-muted);
    border: 1px solid rgba(161, 196, 199, 0.25); padding: 2px 8px; border-radius: 20px; letter-spacing: 0.05em;
    white-space: nowrap; flex-shrink: 0;
  }
  nav.main-nav ul { list-style: none; display: flex; gap: clamp(10px, 1.6vw, 26px); flex-wrap: wrap; }
  nav.main-nav a {
    font-size: 0.85rem; font-weight: 500; color: var(--clr-accent-primary);
    padding-bottom: 4px; border-bottom: 2px solid transparent;
    transition: color 0.2s ease, border-color 0.2s ease; white-space: nowrap;
  }
  nav.main-nav a:hover, nav.main-nav a.active { color: var(--clr-accent-interactive); border-bottom-color: var(--clr-accent-interactive); }
  .nav-toggle {
    display: none; background: none; border: 1px solid rgba(161,196,199,0.3); border-radius: 8px;
    color: var(--clr-text-primary); font-size: 1.2rem; padding: 6px 10px; cursor: pointer;
    flex-shrink: 0; min-width: 44px; min-height: 40px;
  }

  /* ---------- PAGE INTRO ---------- */
  .page-intro { max-width: 880px; margin: 48px auto 0; padding: 0 6vw; text-align: center; }
  .page-intro .eyebrow {
    font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--clr-accent-interactive); margin-bottom: 10px;
  }
  .page-intro h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.6rem, 3.5vw, 2.4rem); letter-spacing: 0.02em; margin-bottom: 12px; }
  .page-intro .page-desc { color: var(--clr-text-muted); font-size: 0.95rem; max-width: 680px; margin: 0 auto; }

  /* ---------- TOOLBAR (search + filters) ---------- */
  .toolbar-wrap { max-width: 1100px; margin: 32px auto 0; padding: 0 6vw; }
  .toolbar {
    padding: 20px clamp(16px, 3vw, 26px);
    background: rgba(30, 45, 66, 0.55);
    border: 1px solid rgba(161, 196, 199, 0.15);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(10px);
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px;
  }

  .toolbar .field-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .toolbar .field-group label {
    font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--clr-text-muted);
  }

  .search-group { flex: 1 1 220px; position: relative; }
  .search-group input {
    width: 100%; padding: 10px 14px 10px 36px;
    background: var(--clr-surface); border: 1px solid rgba(161, 196, 199, 0.2);
    border-radius: var(--radius-md); color: var(--clr-text-primary);
    font-family: var(--font-body); font-size: 0.88rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .search-group input:focus { border-color: var(--clr-accent-interactive); box-shadow: 0 0 0 3px rgba(52,223,236,0.15); outline: none; }
  .search-group input::placeholder { color: var(--clr-text-muted); }
  .search-group .search-icon {
    position: absolute; left: 12px; top: 34px; color: var(--clr-text-muted); font-size: 0.9rem; pointer-events: none;
  }

  .toolbar select {
    padding: 10px 34px 10px 12px; min-width: 118px; max-width: 100%;
    background: var(--clr-surface); border: 1px solid rgba(161, 196, 199, 0.2);
    border-radius: var(--radius-md); color: var(--clr-text-primary);
    font-family: var(--font-body); font-size: 0.85rem; cursor: pointer; appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2334DFEC' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat; background-position: right 10px center;
  }
  .toolbar select:focus { border-color: var(--clr-accent-interactive); box-shadow: 0 0 0 3px rgba(52,223,236,0.15); outline: none; }

  .toolbar .reset-btn {
    font-family: var(--font-mono); font-size: 0.78rem; color: var(--clr-accent-interactive);
    background: transparent; border: 1px solid rgba(52,223,236,0.3); border-radius: var(--radius-md);
    padding: 10px 16px; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
    min-height: 40px;
  }
  .toolbar .reset-btn:hover { background: rgba(52,223,236,0.1); border-color: var(--clr-accent-interactive); }

  .result-summary {
    max-width: 1100px; margin: 18px auto 0; padding: 0 6vw;
    font-family: var(--font-mono); font-size: 0.8rem; color: var(--clr-text-muted);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .result-summary strong { color: var(--clr-accent-interactive); }

  .active-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(52,223,236,0.08); border: 1px solid rgba(52,223,236,0.3);
    color: var(--clr-accent-interactive); border-radius: 999px; padding: 4px 10px 4px 12px;
    font-family: var(--font-mono); font-size: 0.72rem;
    max-width: 100%;
  }
  .chip button {
    background: none; border: none; color: inherit; cursor: pointer; font-size: 0.85rem; line-height: 1; padding: 0;
  }

  /* ---------- PLAYERS GRID ---------- */
  .players-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 6vw 100px; }
  .players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
  }

  .player-card {
    position: relative;
    background: rgba(30, 45, 66, 0.55);
    border: 1px solid rgba(161, 196, 199, 0.15);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(10px);
    padding: 20px 18px;
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    display: flex; flex-direction: column; gap: 14px;
    min-width: 0;
  }
  .player-card:hover { transform: translateY(-4px); border-color: rgba(52,223,236,0.4); box-shadow: var(--shadow-glow); }

  .pc-top { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .pc-avatar {
    position: relative; width: 58px; height: 58px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, rgba(52,223,236,0.18), rgba(42,128,66,0.18));
    border: 1px solid rgba(161,196,199,0.2);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .pc-avatar img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }
  .pc-avatar .pc-initial {
    font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; color: var(--clr-accent-interactive);
    position: relative; z-index: 1;
  }
  .hidden { display: none !important; }

  .pc-name-role { min-width: 0; flex: 1; }
  .pc-name { font-family: var(--font-display); font-size: 0.95rem; font-weight: 700; letter-spacing: 0.01em; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-role {
    display: inline-block; margin-top: 4px; font-family: var(--font-mono); font-size: 0.65rem;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border-radius: 20px;
  }
  .pc-role.role-player { color: var(--clr-accent-interactive); background: rgba(52,223,236,0.1); border: 1px solid rgba(52,223,236,0.25); }
  .pc-role.role-owner { color: #9CF0B0; background: rgba(42,128,66,0.15); border: 1px solid rgba(42,128,66,0.4); }
  .pc-role.role-both { color: #F3D28A; background: rgba(226,176,76,0.1); border: 1px solid rgba(226,176,76,0.35); }

  .pc-meta { display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 0.72rem; color: var(--clr-text-muted); }
  .pc-meta span { display: flex; align-items: center; gap: 5px; }
  .pc-meta b { color: var(--clr-text-primary); font-weight: 600; }

  .pc-positions { display: flex; flex-wrap: wrap; gap: 6px; }
  .pos-badge {
    font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; padding: 3px 8px;
    border-radius: 6px; background: rgba(42,128,66,0.18); color: #9CF0B0; border: 1px solid rgba(42,128,66,0.35);
  }
  .pc-team {
    font-size: 0.75rem; color: var(--clr-text-muted); padding-top: 10px; border-top: 1px dashed rgba(161,196,199,0.15);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pc-team b { color: var(--clr-accent-primary); }

  /* ---------- STATES ---------- */
  .state-box { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--clr-text-muted); }
  .state-box .state-icon { font-size: 2rem; margin-bottom: 12px; }
  .state-box h3 { font-family: var(--font-display); font-size: 1.05rem; color: var(--clr-text-primary); margin-bottom: 8px; }
  .state-box p { font-size: 0.85rem; max-width: 420px; margin: 0 auto; }

  .skeleton-card {
    height: 168px; border-radius: var(--radius-lg);
    background: linear-gradient(100deg, rgba(30,45,66,0.5) 30%, rgba(37,56,80,0.7) 50%, rgba(30,45,66,0.5) 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s ease-in-out infinite;
    border: 1px solid rgba(161,196,199,0.1);
  }
  @keyframes shimmer { 0% { background-position: 150% 0; } 100% { background-position: -50% 0; } }

  /* ---------- FOOTER ---------- */
  footer.site-footer { text-align: center; padding: 26px 5vw; border-top: 1px solid rgba(161,196,199,0.12); font-size: 0.78rem; color: var(--clr-text-muted); }
  footer.site-footer a { color: var(--clr-accent-interactive); }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 768px) {
    nav.main-nav {
      position: absolute; top: 100%; left: 0; right: 0;
      background: rgba(22,34,53,0.97); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(161,196,199,0.12);
      max-height: 0; overflow: hidden; transition: max-height 0.3s ease;
    }
    nav.main-nav.open { max-height: 400px; }
    nav.main-nav ul { flex-direction: column; padding: 16px 6vw; gap: 14px; }
    .nav-toggle { display: block; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar select { width: 100%; }
  }

  @media (max-width: 600px) {
    header.site-header { padding: 14px 4vw; }
    .logo-img { max-width: 118px; height: 30px; }
    .brand { gap: 8px; }
    .brand .season-tag { font-size: 0.62rem; padding: 2px 6px; }
    .result-summary { flex-direction: column; align-items: flex-start; }
  }

  @media (max-width: 480px) {
    .page-intro { margin-top: 32px; }
    .players-grid { grid-template-columns: 1fr 1fr; }
    .pc-name { font-size: 0.85rem; }
    .pc-avatar { width: 48px; height: 48px; }
  }

  @media (max-width: 360px) {
    .players-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 340px) {
    header.site-header { padding: 12px 3.5vw; }
    .logo-img { max-width: 96px; height: 26px; }
    .brand .season-tag { display: none; }
    .nav-toggle { padding: 5px 8px; font-size: 1.05rem; }
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand" style="cursor:pointer;">
    <img src="logo.png" alt="PHY LIGA Logo" class="logo-img" width="140" height="36.46" />
    <span class="season-tag">Season 01</span>
  </a>
  <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
  <nav class="main-nav" id="mainNav">
    <ul>
      <li><a href="auction.html">Auction</a></li>
      <li><a href="register.html">Registration</a></li>
      <li><a href="players.html" class="active">Players</a></li>
      <li><a href="teams.html">Teams</a></li>
      <li><a href="stats.html">Statistics</a></li>
      <li><a href="fixture.html">Fixture</a></li>
      <li><a href="scoreboard.html">Scoreboard</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="page-intro">
    <p class="eyebrow">The Full Squad List</p>
    <h1>Players</h1>
  </section>

  <section class="toolbar-wrap">
    <div class="toolbar">
      <div class="field-group search-group">
        <label for="searchInput">Search by name</label>
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="e.g. Curzon" autocomplete="off" />
      </div>

      <div class="field-group">
        <label for="batchFilter">Batch</label>
        <select id="batchFilter">
          <option value="">All batches</option>
          <option value="95">95</option>
          <option value="96">96</option>
          <option value="97">97</option>
          <option value="98">98</option>
          <option value="99">99</option>
          <option value="100">100</option>
          <option value="101">101</option>
          <option value="102">102</option>
          <option value="103">103</option>
          <option value="104">104</option>
          <option value="105">105</option>
        </select>
      </div>

      <div class="field-group">
        <label for="hallFilter">Hall</label>
        <select id="hallFilter">
          <option value="">All halls</option>
          <option value="FH">FH</option>
          <option value="SH">SH</option>
          <option value="AE">AE</option>
          <option value="JN">JN</option>
          <option value="SK">SK</option>
          <option value="SN">SN</option>
          <option value="RH">RH</option>
        </select>
      </div>

      <div class="field-group">
        <label for="positionFilter">Position</label>
        <select id="positionFilter">
          <option value="">All positions</option>
          <option value="GK">GK</option>
          <option value="CB">CB</option>
          <option value="LB">LB</option>
          <option value="RB">RB</option>
          <option value="AMF">AMF</option>
          <option value="DMF">DMF</option>
          <option value="CM">CM</option>
          <option value="LM">LM</option>
          <option value="RM">RM</option>
          <option value="LW">LW</option>
          <option value="RW">RW</option>
          <option value="ST">ST</option>
          <option value="CF">CF</option>
        </select>
      </div>

      <div class="field-group">
        <label for="roleFilter">Role</label>
        <select id="roleFilter">
          <option value="">All roles</option>
          <option value="player">Player</option>
          <option value="owner">Owner</option>
          <option value="both">Both</option>
        </select>
      </div>

      <button class="reset-btn" id="resetBtn" type="button">Reset filters</button>
    </div>
  </section>

  <div class="result-summary">
    <div id="resultCount">Loading players…</div>
    <div class="active-chips" id="activeChips"></div>
  </div>

  <section class="players-wrap">
    <div class="players-grid" id="playersGrid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  © 2026 PHY-LIGA · Developed by <a href="https://www.facebook.com/fardin.0112" target="_blank" rel="noopener">Fardin Hossain</a> · Feathered by <a href="https://www.facebook.com/tawkir.hossain.16" target="_blank" rel="noopener">Tawkir Hossain</a>
</footer>

<script>
  /* ---------- Nav toggle (mobile) ---------- */
  const navToggle = document.getElementById("navToggle");
  const mainNav = document.getElementById("mainNav");
  function closeNav() { mainNav.classList.remove("open"); navToggle.setAttribute("aria-expanded", "false"); navToggle.textContent = "☰"; }
  function toggleNav() { const isOpen = mainNav.classList.toggle("open"); navToggle.setAttribute("aria-expanded", String(isOpen)); navToggle.textContent = isOpen ? "✕" : "☰"; }
  navToggle.addEventListener("click", (e) => { e.stopPropagation(); toggleNav(); });
  mainNav.querySelectorAll("a").forEach(link => link.addEventListener("click", closeNav));
  document.addEventListener("click", (e) => { if (mainNav.classList.contains("open") && !mainNav.contains(e.target) && !navToggle.contains(e.target)) closeNav(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeNav(); });

  /* ---------- State ---------- */
  let allPlayers = [];
  const grid = document.getElementById("playersGrid");
  const resultCount = document.getElementById("resultCount");
  const activeChips = document.getElementById("activeChips");

  const searchInput = document.getElementById("searchInput");
  const batchFilter = document.getElementById("batchFilter");
  const hallFilter = document.getElementById("hallFilter");
  const positionFilter = document.getElementById("positionFilter");
  const roleFilter = document.getElementById("roleFilter");
  const resetBtn = document.getElementById("resetBtn");

  const ROLE_LABELS = { player: "Player", owner: "Owner", both: "Both" };

  /* ---------- Google Drive link → hotlinkable thumbnail ---------- */
  function driveThumb(link) {
    if (!link) return null;
    const m = link.match(/\/d\/([a-zA-Z0-9_-]+)/) || link.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (m && m[1]) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w200`;
    return link;
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  /* ---------- Render ---------- */
  function renderCard(p) {
    const initial = (p.fullName || "?").trim().charAt(0).toUpperCase();
    const thumb = driveThumb(p.photoLink);
    const positions = Array.isArray(p.preferredPositions) ? p.preferredPositions : [];
    const roleClass = p.role === "owner" ? "role-owner" : p.role === "both" ? "role-both" : "role-player";
    const teamLine = p.teamName
      ? `<div class="pc-team">Team: <b>${escapeHtml(p.teamName)}</b></div>`
      : (p.role !== "owner" ? `<div class="pc-team">Team: <b>Unassigned</b></div>` : "");

    return `
      <div class="player-card">
        <div class="pc-top">
          <div class="pc-avatar">
            ${thumb ? `<img src="${thumb}" alt="" loading="lazy" onerror="this.remove(); this.nextElementSibling?.classList.remove('hidden');" />` : ""}
            <span class="pc-initial ${thumb ? "hidden" : ""}">${escapeHtml(initial)}</span>
          </div>
          <div class="pc-name-role">
            <div class="pc-name" title="${escapeHtml(p.fullName)}">${escapeHtml(p.fullName || "Unnamed")}</div>
            <span class="pc-role ${roleClass}">${ROLE_LABELS[p.role] || p.role || "—"}</span>
          </div>
        </div>
        <div class="pc-meta">
          <span>🎓 Batch <b>${escapeHtml(p.batch ?? "—")}</b></span>
          <span>🏛️ <b>${escapeHtml(p.hall ?? "—")}</b></span>
        </div>
        ${positions.length ? `<div class="pc-positions">${positions.map(pos => `<span class="pos-badge">${escapeHtml(pos)}</span>`).join("")}</div>` : ""}
        ${teamLine}
      </div>
    `;
  }

  function currentFilters() {
    return {
      search: searchInput.value.trim().toLowerCase(),
      batch: batchFilter.value,
      hall: hallFilter.value,
      position: positionFilter.value,
      role: roleFilter.value
    };
  }

  function applyFilters() {
    const f = currentFilters();
    let list = allPlayers.filter(p => {
      if (f.search && !(p.fullName || "").toLowerCase().includes(f.search)) return false;
      if (f.batch && String(p.batch) !== f.batch) return false;
      if (f.hall && p.hall !== f.hall) return false;
      if (f.role && p.role !== f.role) return false;
      if (f.position) {
        const positions = Array.isArray(p.preferredPositions) ? p.preferredPositions : [];
        if (!positions.includes(f.position)) return false;
      }
      return true;
    });

    // Sort alphabetically by name for predictable scanning
    list.sort((a, b) => (a.fullName || "").localeCompare(b.fullName || ""));

    renderChips(f);
    renderResultCount(list.length);
    renderGrid(list);
  }

  function renderChips(f) {
    const chips = [];
    if (f.search) chips.push({ key: "search", label: `Name: "${f.search}"` });
    if (f.batch) chips.push({ key: "batch", label: `Batch ${f.batch}` });
    if (f.hall) chips.push({ key: "hall", label: `Hall ${f.hall}` });
    if (f.position) chips.push({ key: "position", label: `Position ${f.position}` });
    if (f.role) chips.push({ key: "role", label: ROLE_LABELS[f.role] });

    activeChips.innerHTML = chips.map(c =>
      `<span class="chip">${escapeHtml(c.label)}<button data-key="${c.key}" aria-label="Remove filter">✕</button></span>`
    ).join("");

    activeChips.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.key;
        if (key === "search") searchInput.value = "";
        if (key === "batch") batchFilter.value = "";
        if (key === "hall") hallFilter.value = "";
        if (key === "position") positionFilter.value = "";
        if (key === "role") roleFilter.value = "";
        applyFilters();
      });
    });
  }

  function renderResultCount(n) {
    resultCount.innerHTML = `Showing <strong>${n}</strong> of <strong>${allPlayers.length}</strong> registered ${allPlayers.length === 1 ? "person" : "people"}`;
  }

  function renderGrid(list) {
    if (!list.length) {
      grid.innerHTML = `
        <div class="state-box">
          <div class="state-icon">🔎</div>
          <h3>No matches found</h3>
          <p>Try clearing a filter or checking the spelling of the name you searched for.</p>
        </div>`;
      return;
    }
    grid.innerHTML = list.map(renderCard).join("");
  }

  [searchInput, batchFilter, hallFilter, positionFilter, roleFilter].forEach(el => {
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, applyFilters);
  });

  resetBtn.addEventListener("click", () => {
    searchInput.value = "";
    batchFilter.value = "";
    hallFilter.value = "";
    positionFilter.value = "";
    roleFilter.value = "";
    applyFilters();
  });

  /* ---------- Firebase fetch ---------- */
  (async function loadPlayers() {
    try {
      const [{ db }, firestoreMod] = await Promise.all([
        import("./assets/js/firebase-config.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]);
      const { collection, getDocs } = firestoreMod;
      const snap = await getDocs(collection(db, "publicPlayers"));

      allPlayers = [];
      snap.forEach(docSnap => allPlayers.push({ id: docSnap.id, ...docSnap.data() }));

      if (!allPlayers.length) {
        resultCount.textContent = "No one has registered yet.";
        grid.innerHTML = `
          <div class="state-box">
            <div class="state-icon">⛹🏼‍♂️⛹🏼‍♂️</div>
            <h3>No players yet</h3>
            <p>Be the first to join PHY-LIGA Season 01 — head over to the registration page.</p>
          </div>`;
        return;
      }

      applyFilters();
    } catch (err) {
      console.error("Failed to load players:", err);
      resultCount.textContent = "Couldn't load players.";
      grid.innerHTML = `
        <div class="state-box">
          <div class="state-icon">⚠️</div>
          <h3>Couldn't reach the player database</h3>
          <p>If you're opening this file directly on your computer, serve it through a local web server (e.g. VS Code's "Live Server" extension) or view it on the live deployed site.</p>
        </div>`;
    }
  })();
</script>
